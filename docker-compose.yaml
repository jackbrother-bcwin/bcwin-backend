services:
  traefik:
    image: traefik:v3.6
    container_name: bcwin-traefik
    command:
      # - "--api.insecure=true"
      - "--api=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--accesslog=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@bcwin.club"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080" # Traefik dashboard
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.bcwin.club`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt_data:/letsencrypt
    networks:
      - app-network
    restart: unless-stopped

  dozzle:
    container_name: dozzle
    image: amir20/dozzle:latest
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.rule=Host(`dozzle.bcwin.club`)"
      - "traefik.http.routers.dozzle.tls=true"
      - "traefik.http.routers.dozzle.tls.certresolver=letsencrypt"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle:/data
    networks:
      - app-network
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env.docker.prod
    deploy:
      replicas: 4
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.rule=Host(`api.bcwin.club`)"
      # - "traefik.http.routers.api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      - "traefik.http.services.api.loadbalancer.sticky.cookie=true"
      # Live game socket on the *site* hosts — Next cannot upgrade WS.
      # Higher priority than the frontend Host() router.
      - "traefik.http.routers.api-ws-app.entrypoints=websecure"
      - "traefik.http.routers.api-ws-app.rule=(Host(`bcwin.club`) || Host(`www.bcwin.club`) || Host(`bcwin7.site`) || Host(`www.bcwin7.site`) || Host(`bcwin7.live`) || Host(`www.bcwin7.live`) || Host(`bcwin.click`) || Host(`www.bcwin.click`) || Host(`bcwin7.xyz`) || Host(`www.bcwin7.xyz`) || Host(`bcwin.best`) || Host(`www.bcwin.best`)) && PathPrefix(`/api/v1/ws`)"
      - "traefik.http.routers.api-ws-app.tls=true"
      - "traefik.http.routers.api-ws-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-ws-app.service=api"
      - "traefik.http.routers.api-ws-app.priority=200"
    depends_on:
      redis:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  engine:
    container_name: bcwin-engine
    build:
      context: .
      dockerfile: Dockerfile
    command: bun run apps/engine/src/index.ts
    # ports:
    #   - "3001:3001"
    env_file:
      - .env.docker.prod
    depends_on:
      redis:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:8.4-alpine
    container_name: bcwin-redis
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    image: bcwin-frontend:latest
    container_name: bcwin-frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.rule=Host(`bcwin.club`) || Host(`www.bcwin.club`) || Host(`bcwin7.site`) || Host(`www.bcwin7.site`) || Host(`bcwin7.live`) || Host(`www.bcwin7.live`) || Host(`bcwin.click`) || Host(`www.bcwin.click`) || Host(`bcwin7.xyz`) || Host(`www.bcwin7.xyz`) || Host(`bcwin.best`) || Host(`www.bcwin.best`)"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    depends_on:
      - api
    networks:
      - app-network
    restart: unless-stopped

volumes:
  letsencrypt_data:

networks:
  app-network:
    driver: bridge
