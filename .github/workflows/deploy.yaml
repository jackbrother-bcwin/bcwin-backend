jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Production Env File
        run: |
          cat <<EOF > .env.docker.prod
          NODE_ENV=production
          JWT_SECRET="${{ env.JWT_SECRET }}"
          DOMAIN="${{ env.DOMAIN }}"
          API_PORT=${{ env.API_PORT }}
          ENGINE_PORT=${{ env.ENGINE_PORT }}
          DATABASE_URL="${{ env.DATABASE_URL }}"
          REDIS_URL="${{ env.REDIS_URL }}"
          LAAFIC_APPID="${{ env.LAAFIC_APPID }}"
          LAAFFIC_APIKEY="${{ env.LAAFFIC_APIKEY }}"
          LAAFFIC_API_SECRET="${{ env.LAAFFIC_API_SECRET }}"
          CXPAY_PAYMENT_NOTIFICATION_URL="${{ env.CXPAY_PAYMENT_NOTIFICATION_URL }}"
          CXPAY_PAYMENT_RETURN_URL="${{ env.CXPAY_PAYMENT_RETURN_URL }}"
          CXPAY_WITHDRAW_NOTIFICATION_URL="${{ env.CXPAY_WITHDRAW_NOTIFICATION_URL }}"
          CXPAY_WITHDRAW_PAY_CODE="${{ env.CXPAY_WITHDRAW_PAY_CODE }}"
          CXPAY_MERCHANT_KEY="${{ env.CXPAY_MERCHANT_KEY }}"
          CXPAY_MERCHANT_ID="${{ env.CXPAY_MERCHANT_ID }}"
          CXPAY_TEST_PAY_CODE="${{ env.CXPAY_TEST_PAY_CODE }}"
          CXPAY_PAYMENT_PAY_CODE="${{ env.CXPAY_PAYMENT_PAY_CODE }}"
          CXPAY_TEST_MODE=${{ env.CXPAY_TEST_MODE }}
          XDPAY_PAYMENT_NOTIFICATION_URL="${{ env.XDPAY_PAYMENT_NOTIFICATION_URL }}"
          XDPAY_WITHDRAW_NOTIFICATION_URL="${{ env.XDPAY_WITHDRAW_NOTIFICATION_URL }}"
          XDPAY_MERCHANT_ID="${{ env.XDPAY_MERCHANT_ID }}"
          XDPAY_MERCHANT_KEY="${{ env.XDPAY_MERCHANT_KEY }}"
          XDPAY_TEST_MODE=${{ env.XDPAY_TEST_MODE }}
          OXAPAY_MERCHANT_API_KEY="${{ env.OXAPAY_MERCHANT_API_KEY }}"
          OXAPAY_PAYOUT_API_KEY="${{ env.OXAPAY_PAYOUT_API_KEY }}"
          OXAPAY_PAYMENT_NOTIFICATION_URL="${{ env.OXAPAY_PAYMENT_NOTIFICATION_URL }}"
          OXAPAY_WITHDRAW_NOTIFICATION_URL="${{ env.OXAPAY_WITHDRAW_NOTIFICATION_URL }}"
          OXAPAY_PAYMENT_RETURN_URL="${{ env.OXAPAY_PAYMENT_RETURN_URL }}"
          OXAPAY_TEST_MODE=${{ env.OXAPAY_TEST_MODE }}
          INOUT_OPERATOR_ID="${{ env.INOUT_OPERATOR_ID }}"
          INOUT_SECRET_KEY="${{ env.INOUT_SECRET_KEY }}"
          MAILEROO_API_KEY="${{ env.MAILEROO_API_KEY }}"
          MAILEROO_FROM_EMAIL="${{ env.MAILEROO_FROM_EMAIL }}"
          MAILEROO_SMTP_PASS="${{ env.MAILEROO_SMTP_PASS }}"
          EOF

      - name: Copy to Deployment Path
        run: |
          mkdir -p /root/bcwin/backend
          rsync -avz --exclude '.git' --exclude 'node_modules' ./ /root/bcwin/backend/

      - name: Deploy Backend Services
        run: |
          cd /root/bcwin/backend
          
          # 1. Build the new container images
          docker compose build api engine
          
          # 2. Ensure the database service is running and healthy
          docker compose up -d db
          
          # 3. Run migrations against the database using the new image
          docker compose run --rm api bun run prisma:migrate:deploy
          
          # 4. Recreate and start the api and engine containers using the new images
          docker compose up -d --no-build api engine
